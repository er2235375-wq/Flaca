<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrellas para Cecilia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #000814 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Estilo para el texto final "para Cecilia" */
        .dedication {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            color: #ffd166;
            font-size: clamp(1.5rem, 2.5vw, 2.2rem);
            letter-spacing: 4px;
            font-weight: 300;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            text-shadow: 0 0 10px rgba(255, 209, 102, 0.8),
                         0 0 20px rgba(255, 145, 77, 0.5);
            pointer-events: none;
            text-align: center;
        }

        .dedication.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <canvas id="galaxyCanvas"></canvas>
    <div id="dedication" class="dedication">para Cecilia</div>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');
        const dedicationEl = document.getElementById('dedication');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let particles = [];
        let state = 'scattered'; // Estados: 'scattered', 'forming', 'formed'
        let timer = 0;

        class Particle {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.radius = Math.random() * 1.5 + 0.5;
                this.baseAlpha = Math.random() * 0.7 + 0.3;
                this.alpha = this.baseAlpha;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.ease = Math.random() * 0.03 + 0.02;
            }

            update() {
                if (state === 'scattered') {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                } else if (state === 'forming') {
                    let dx = this.targetX - this.x;
                    let dy = this.targetY - this.y;
                    this.x += dx * this.ease;
                    this.y += dy * this.ease;
                } else if (state === 'formed') {
                    this.x = this.targetX + (Math.random() - 0.5) * 0.8;
                    this.y = this.targetY + (Math.random() - 0.5) * 0.8;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.shadowBlur = state === 'formed' ? 8 : 2;
                ctx.shadowColor = '#a855f7';
                ctx.fill();
            }
        }

        function initTextPoints() {
            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            tempCanvas.width = width;
            tempCanvas.height = height;

            tCtx.fillStyle = 'white';
            
            // Tamaño de fuente adaptable según la pantalla
            let fontSize = width < 768 ? 18 : 26;
            tCtx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
            tCtx.textAlign = 'center';
            tCtx.textBaseline = 'middle';

            // Dividir la frase en dos líneas para que no se corte en los lados
            const line1 = "Y EN LA NOCHE QUE LAS ESTRELLAS SALEN";
            const line2 = "YO PIENSO EN TI MI AMOR";

            let centerY = height / 2;
            let spacing = fontSize * 1.6; // Espacio vertical entre líneas

            tCtx.fillText(line1, width / 2, centerY - spacing / 2);
            tCtx.fillText(line2, width / 2, centerY + spacing / 2);

            const imgData = tCtx.getImageData(0, 0, width, height);
            const data = imgData.data;
            const points = [];

            let step = width < 768 ? 3 : 4; 
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    let index = (y * width + x) * 4;
                    if (data[index + 3] > 128) {
                        points.push({ x: x, y: y });
                    }
                }
            }

            return points;
        }

        function setup() {
            const targetPoints = initTextPoints();
            particles = [];

            for (let i = 0; i < targetPoints.length; i++) {
                let startX = Math.random() * width;
                let startY = Math.random() * height;
                particles.push(new Particle(startX, startY, targetPoints[i].x, targetPoints[i].y));
            }

            // Partículas extra de fondo (galaxia libre)
            for (let i = 0; i < 300; i++) {
                particles.push(new Particle(Math.random() * width, Math.random() * height, Math.random() * width, Math.random() * height));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            timer++;

            if (timer > 200 && state === 'scattered') {
                state = 'forming';
            }

            if (timer > 380 && state === 'forming') {
                state = 'formed';
                dedicationEl.classList.add('visible');
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        setup();
        animate();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            timer = 0;
            state = 'scattered';
            dedicationEl.classList.remove('visible');
            setup();
        });
    </script>
</body>
</html>
